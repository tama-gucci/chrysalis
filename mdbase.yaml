spec_version: "0.3.0"
name: "chrysalis"
description: "Chrysalis AI Agent Framework authoritative mdbase v0.3 collection"
settings:
  types_folder: "_types"
  contracts_folder: "_contracts"
  record_extensions:
    - "md"
  validation: "error"
  explicit_type_keys:
    - "type"
    - "types"
  id_field: "id"
  include_subfolders: true
  exclude:
    - "_types"
    - "_contracts"
    - "_templates"
    - ".git"
    - ".agent"
    - ".agents"
    - ".chrysalis"
    - "System"
    - "System/_templates"
    - "System/Environment"
    - "System/Orchestrators"
    - "System/Workflows"
    - "System/scripts"
    - "System/Runtime-Constitution.md"
    - "System/System-Health.md"
    - "System/Changelog.md"
    - "System/Ingestion-Sources.md"
    - "System/Integrations.md"
    - "TaskNotes/_templates"
    - "TaskNotes/Archive"
    - "TaskNotes/Daily"
    - "TaskNotes/Views"
    - "TaskNotes/Workflows"
    - "Daily"
    - "Workflows"
    - "Development"
    - "Projects/README.md"
    - "Projects/_templates"
    - "Slipbox/README.md"
    - "Slipbox/_templates"
    - "contracts"
    - "docs"
    - "fixtures"
    - "helpers"
    - "apps"
    - "tests"
    - "AGENTS.md"
    - "ARCHITECTURE.md"
    - "CHANGELOG.md"
    - "CONTRIBUTING.md"
    - "Dashboard.md"
    - "README.md"
    - "STATUS.md"
